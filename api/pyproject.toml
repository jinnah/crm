[project]
name = "crm-api"
version = "0.1.0"
description = "Single-tenant CRM API for local service businesses"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pillow>=11.4.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "pypdf>=6.15.0",
    "reportlab>=5.0.0",
    "boto3>=1.43.67",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
