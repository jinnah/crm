services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm-dev-password}@db:5432/${POSTGRES_DB:-crm}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:-dev-only-pepper-not-for-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INBOUND_API_KEY: ${INBOUND_API_KEY:-}
      N8N_SEND_URL: ${N8N_SEND_URL:-http://n8n:5678/webhook/twilio-send}
      N8N_SEND_SECRET: ${N8N_SEND_SECRET:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      # Server-side only: never exposed to the browser.
      N8N_FORM_WEBHOOK_URL: ${N8N_FORM_WEBHOOK_URL:-http://n8n:5678/webhook/web-form}
      FORM_SHARED_SECRET: ${FORM_SHARED_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  n8n:
    image: n8nio/n8n:2.11.3
    environment:
      # Placeholder only — generate a real key per installation.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-n8n-encryption-key}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false" # local HTTP development
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # n8n 2.x runs Code nodes in a task runner; it needs the same allowances.
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      # Editor access is protected by n8n's own owner/user management (set up
      # on first visit). n8n 2.x has no basic-auth env mechanism; the port
      # binding below plus a reverse proxy are the network-level controls.
      # Workflow configuration (all placeholders; never commit real values).
      CRM_API_URL: http://api:8000
      CRM_INBOUND_API_KEY: ${INBOUND_API_KEY:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL:-http://localhost:5678}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      FORM_SHARED_SECRET: ${FORM_SHARED_SECRET:-}
      CRM_SEND_SECRET: ${N8N_SEND_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Override only for local verification against a mock provider.
      TWILIO_API_BASE: ${TWILIO_API_BASE:-https://api.twilio.com}
    ports:
      # Loopback-only: the editor is never exposed on the host's network
      # interfaces. Production terminates provider webhooks at a reverse proxy.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  n8n_data:
